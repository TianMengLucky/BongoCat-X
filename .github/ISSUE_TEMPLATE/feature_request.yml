name: ✨ 功能建议 ✨
description: "💡 有想法？在这里分享！"
title: "[✨Feat]: "
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 🌈 你想解决的问题
      description: "描述你遇到的不便，或希望新增 / 改进的功能。"
    validations:
      required: true
  - type: textarea
    id: way-to-solve
    attributes:
      label: 🚀 你期望的效果
      description: "描述你理想中的解决方式，不用考虑技术细节。"
    validations:
      required: false
  - type: textarea
    id: instead
    attributes:
      label: 🤔 备选方案
      description: "可选，如果有其他思路，也欢迎一并分享。"
    validations:
      required: false
  - type: checkboxes
    id: "latest-version"
    attributes:
      label: "✅ 提交前确认"
      description: "提交建议前，请确认以下事项："
      options:
        - label: "🌟 我已核对最新版本，确认该功能尚未实现。"
          required: true
        - label: "📋 我已搜索过已有建议，确认这不是重复提议。"
          required: true
