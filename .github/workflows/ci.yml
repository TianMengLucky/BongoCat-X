name: BongoCat CI

on:
  # Checks run on development pushes and on every pull request (including the
  # PRs that merge into the protected X branch). Pushes to X itself are not
  # checked here: its commits arrive through reviewed pull requests and its
  # multi-platform builds are owned by the release workflow.
  push:
    branches: ["dev"]
    # Documentation-only pushes cannot affect the checks below.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# Tag pushes do not trigger this workflow: a tag points at a commit whose
# checks already ran when the branch was pushed, and the release workflow
# owns tagged builds. This keeps a single commit from being checked twice.

permissions:
  contents: read

concurrency:
  group: bongocat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: quality / rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-v2-${{ runner.os }}-${{ hashFiles('src/rust/**/Cargo.lock') }}
          restore-keys: cargo-downloads-v2-${{ runner.os }}-
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust test artifacts
        uses: actions/cache@v5
        with:
          path: build-rust-tests
          key: rust-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src/rust/**/Cargo.lock', 'src/rust/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src/rust/**/Cargo.lock', 'src/rust/**/Cargo.toml') }}-
      # Inox2D needs CMake's patched upstream tree; the host build checks it.
      - name: Test host parsers and standalone Rust plugins
        shell: bash
        run: |
          set -euo pipefail
          for crate in bongo-safe bongo-plugin bongo-items bongo-sounds bongo-stats bongo-store; do
            cargo test --locked --manifest-path "src/rust/$crate/Cargo.toml" \
              --target-dir "$GITHUB_WORKSPACE/build-rust-tests"
          done

  macos-rust-link:
    name: quality / macos-rust-http-link
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      # Keep native build trees out of the cache; Cargo validates its own fingerprints.
      - name: Cache Rust downloads and link artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            build-macos-link/cargo/build
          key: rust-macos-link-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/rust/**/Cargo.lock', 'src/rust/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-macos-link-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/rust/**/Cargo.lock', 'src/rust/**/Cargo.toml') }}-
      - name: Configure diagnostic host
        run: |
          cmake -S . -B build-macos-link -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_BUILD_INOX2D=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON
      - name: Verify native Rust dependencies link
        run: cmake --build build-macos-link --target bongo_cat --parallel "$(getconf _NPROCESSORS_ONLN)"

  # The tag/version check lives in release.yml, which is the only workflow a
  # tag push triggers; keeping a second copy here would spin a runner for a
  # job that can never satisfy its condition.
  publishing-policy:
    name: security / publishing-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate publishing guards
        shell: pwsh
        run: ./.github/scripts/check-publish-guards.ps1 -SelfTest

  # Preserve the existing required status while the two analyzers run in parallel.
  quality:
    name: quality / static-analysis
    needs: [cppcheck, gcc-analysis]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both static analyzers to pass
        env:
          CPPCHECK_RESULT: ${{ needs.cppcheck.result }}
          GCC_RESULT: ${{ needs.gcc-analysis.result }}
        run: test "$CPPCHECK_RESULT" = success && test "$GCC_RESULT" = success

  cppcheck:
    name: quality / cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Identify Cppcheck version
        id: cppcheck
        run: echo "version=$(cppcheck --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # C/C++ have separate analysis directories. Cppcheck validates changed
      # source; a header or option change starts a fresh cache conservatively.
      - name: Cache Cppcheck analysis
        uses: actions/cache@v5
        with:
          path: build-cppcheck
          key: cppcheck-v1-${{ runner.os }}-${{ steps.cppcheck.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml', 'include/**/*.h', 'include/**/*.hpp', 'src/**/*.h', 'src/**/*.hpp') }}-${{ github.sha }}
          restore-keys: |
            cppcheck-v1-${{ runner.os }}-${{ steps.cppcheck.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml', 'include/**/*.h', 'include/**/*.hpp', 'src/**/*.h', 'src/**/*.hpp') }}-

      - name: Check C and C++ safety with Cppcheck
        shell: bash
        run: |
          mkdir -p build-cppcheck/c build-cppcheck/cpp
          mapfile -d '' c_files < <(find src -type f -name '*.c' -print0)
          cppcheck -j 2 --cppcheck-build-dir=build-cppcheck/c --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --std=c11 -Iinclude -Isrc/runtime \
            -Isrc/runtime/lifecycle -Isrc/runtime/model \
            -Isrc/runtime/model/import -Isrc/runtime/model/import/mver \
            -Isrc/runtime/model/import/nearby -Isrc/runtime/shell \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme -Isrc/platform/windows "${c_files[@]}"
          mapfile -d '' cpp_files < <(find src -type f -name '*.cpp' -print0)
          cppcheck -j 2 --cppcheck-build-dir=build-cppcheck/cpp --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=passedByValueCallback --std=c++17 \
            -Iinclude -Isrc/runtime -Isrc/runtime/model/import \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme "${cpp_files[@]}"

  gcc-analysis:
    name: quality / gcc-analysis
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # The bongo-safe Rust crate is a hard build requirement (cmake/Rust.cmake).
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-v2-${{ runner.os }}-${{ hashFiles('src/rust/**/Cargo.lock') }}
          restore-keys: cargo-downloads-v2-${{ runner.os }}-

      # Keep the sccache install consistent with the build job (the official
      # static binary) instead of relying on apt packaging.
      - name: Install sccache
        run: |
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.9.1-x86_64-unknown-linux-musl/sccache \
            /usr/local/bin/sccache
          sccache --version

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/sccache
            build-quality/cargo/build
          key: compiler-quality-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: compiler-quality-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install quality and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev libxcb-screensaver0-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Reject legacy product-name references
        run: |
          legacy='l2d''cat'
          if git grep -Ini "$legacy" -- .; then
            echo "Legacy product-name reference found"
            exit 1
          fi

      - name: Check rolling nightly assets
        run: |
          python3 .github/scripts/test-nightly-assets.py
          python3 .github/scripts/test-extract-changelog.py

      - name: Check source file size policy
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLines.cmake

      - name: Check host and plugin translations
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLocalization.cmake

      - name: Check native renderer integration and platform source policy
        run: cmake -P cmake/CheckNativeRenderIntegration.cmake

      - name: Check Windows icon dimensions and image data
        run: python3 scripts/check-windows-icon.py

      # Inox2D is Rust-only and is built by sanitizers; GCC gains no coverage
      # from building it here. Keep all native targets and the host link check.
      # Translation-unit diagnostics do not need the release job's LTO link.
      - name: Configure warning-clean Linux build
        env:
          CC: gcc
          CXX: g++
        run: |
          attempt=1
          until cmake -S . -B build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_STATIC_ANALYZER=ON \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_BUILD_INOX2D=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Register GCC diagnostics
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build and analyze C memory safety
        run: bash .github/scripts/build-unix.sh cmake --build build-quality --parallel 2

      # Preserve completed compilations even when a later check fails.
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/sccache
            build-quality/cargo/build
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  clang-tidy:
    name: quality / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-v2-${{ runner.os }}-${{ hashFiles('src/rust/**/Cargo.lock') }}
          restore-keys: cargo-downloads-v2-${{ runner.os }}-

      - name: Install Clang analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 clang-tidy-18 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev libxcb-screensaver0-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Validate Clang-Tidy rules
        run: clang-tidy-18 --verify-config

      # Inox2D contains Rust only; it contributes no C/C++ files to Clang-Tidy.
      - name: Generate compilation database
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          attempt=1
          until cmake -S . -B build-clang-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBONGO_CAT_PCH=OFF \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_BUILD_INOX2D=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Analyze project memory safety and common coding errors
        run: |
          run-clang-tidy-18 -p build-clang-tidy -j 2 \
            -header-filter="^${GITHUB_WORKSPACE}/(include|src)/" \
            "^${GITHUB_WORKSPACE}/src/"

  sanitizers:
    name: quality / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cargo-downloads-v2-${{ runner.os }}-${{ hashFiles('src/rust/**/Cargo.lock') }}
          restore-keys: cargo-downloads-v2-${{ runner.os }}-

      # Keep the sccache install consistent with the build job (the official
      # static binary) instead of relying on apt packaging.
      - name: Install sccache
        run: |
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.9.1-x86_64-unknown-linux-musl/sccache \
            /usr/local/bin/sccache
          sccache --version

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/sccache
            build-sanitizers/cargo/build
          key: compiler-sanitizers-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: compiler-sanitizers-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install sanitizer and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 llvm-18 libclang-rt-18-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev libxcb-screensaver0-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Configure instrumented application
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          attempt=1
          until cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_C_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Build instrumented application
        run: bash .github/scripts/build-unix.sh cmake --build build-sanitizers --target bongo_cat --parallel 2

      - name: Check application memory and undefined behavior
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          UBSAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          BONGO_CAT_DISABLE_NEARBY_MODEL_SCAN: '1'
        run: |
          bash .github/scripts/test-unix.sh \
            bash .github/scripts/run-sanitizers.sh \
            "$GITHUB_WORKSPACE/build-sanitizers/BongoCat" \
            "$GITHUB_WORKSPACE/build-sanitizers/reports"

      - name: Upload sanitizer diagnostics
        if: always() && github.repository == 'TianMengLucky/BongoCat-X'
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-sanitizers/reports/
            ${{ runner.temp }}/bongocat-native-build.log
          if-no-files-found: ignore
          retention-days: 14

      # Preserve completed compilations even when a later check fails.
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/sccache
            build-sanitizers/cargo/build
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
