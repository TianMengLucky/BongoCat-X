name: BongoCat CI

on:
  push:
    branches: ["X"]
  pull_request:
  workflow_dispatch:

# Tag pushes do not trigger this workflow: a tag points at a commit whose
# checks already ran when the branch was pushed, and the release workflow
# owns tagged builds. This keeps a single commit from being checked twice.

permissions:
  contents: read

concurrency:
  group: bongocat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: quality / tag-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./.github/scripts/check-tag-version.ps1 -Tag $env:GITHUB_REF_NAME

  publishing-policy:
    name: security / publishing-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate publishing guards
        shell: pwsh
        run: ./.github/scripts/check-publish-guards.ps1 -SelfTest

  quality:
    name: quality / static-analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install quality and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build cppcheck \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Reject legacy product-name references
        run: |
          legacy='l2d''cat'
          if grep -RIni --exclude-dir=.git --exclude-dir=build \
              --exclude='*.png' --exclude='*.flac' "$legacy" .; then
            echo "Legacy product-name reference found"
            exit 1
          fi

      - name: Check source file size policy
        run: cmake -DROOT="$GITHUB_WORKSPACE" -P cmake/CheckLines.cmake

      - name: Check Windows icon dimensions and image data
        run: python3 scripts/check-windows-icon.py

      - name: Check C and C++ safety with Cppcheck
        shell: bash
        run: |
          mapfile -d '' c_files < <(find src -type f -name '*.c' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --std=c11 -Iinclude -Isrc/runtime \
            -Isrc/runtime/lifecycle -Isrc/runtime/model \
            -Isrc/runtime/model/import -Isrc/runtime/model/import/mver \
            -Isrc/runtime/model/import/nearby -Isrc/runtime/shell \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme -Isrc/platform/windows "${c_files[@]}"
          mapfile -d '' cpp_files < <(find src -type f -name '*.cpp' -print0)
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=passedByValueCallback --std=c++17 \
            -Iinclude -Isrc/runtime -Isrc/runtime/model/import \
            -Isrc/ui/backend -Isrc/ui/preferences -Isrc/ui/rendering \
            -Isrc/ui/theme "${cpp_files[@]}"

      - name: Configure warning-clean Linux build
        env:
          CC: gcc
          CXX: g++
        run: |
          attempt=1
          until cmake -S . -B build-quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_STATIC_ANALYZER=ON \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Register GCC diagnostics
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build and analyze C memory safety
        run: bash .github/scripts/build-unix.sh cmake --build build-quality --parallel 2

  clang-tidy:
    name: quality / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Clang analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 clang-tidy-18 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Validate Clang-Tidy rules
        run: clang-tidy-18 --verify-config

      - name: Generate compilation database
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          attempt=1
          until cmake -S . -B build-clang-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Analyze project memory safety and common coding errors
        run: |
          run-clang-tidy-18 -p build-clang-tidy -j 2 \
            -header-filter="^${GITHUB_WORKSPACE}/(include|src)/" \
            "^${GITHUB_WORKSPACE}/src/"

  sanitizers:
    name: quality / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install sanitizer and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 llvm-18 libclang-rt-18-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxfixes-dev \
            libcurl4-openssl-dev libfontconfig1-dev

      - name: Configure instrumented application
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          attempt=1
          until cmake -S . -B build-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=OFF \
            -DCMAKE_C_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Build instrumented application
        run: bash .github/scripts/build-unix.sh cmake --build build-sanitizers --target bongo_cat --parallel 2

      - name: Check application memory and undefined behavior
        timeout-minutes: 10
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          UBSAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          BONGO_CAT_DISABLE_NEARBY_MODEL_SCAN: '1'
        run: |
          bash .github/scripts/test-unix.sh \
            bash .github/scripts/run-sanitizers.sh \
            "$GITHUB_WORKSPACE/build-sanitizers/BongoCat" \
            "$GITHUB_WORKSPACE/build-sanitizers/reports"

      - name: Upload sanitizer diagnostics
        if: always() && github.repository == 'vladelaina/BongoCat'
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-sanitizers/reports/
            ${{ runner.temp }}/bongocat-native-build.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build / ${{ matrix.platform }}
    # Heavy multi-platform compilation and artifact uploads only run when the
    # main branch is merged into X (a push that advances X), or on a manual
    # dispatch from X. Ordinary pushes run checks only.
    if: >-
      github.repository == 'TianMengLucky/BongoCat-X' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/X'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_arch: x64
          - os: windows-2022
            platform: windows-x86
            cmake_arch: Win32
          - os: ubuntu-24.04
            platform: linux-x64
            cmake_arch: ''
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            libxi-dev libxfixes-dev libcurl4-openssl-dev libfontconfig1-dev

      # Keep the Linux sccache install consistent with release.yml (the
      # official static binary) instead of relying on apt packaging.
      - name: Install sccache (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.9.1-x86_64-unknown-linux-musl/sccache \
            /usr/local/bin/sccache
          sccache --version

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sccache

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sccache -y --no-progress

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/AppData/Local/Mozilla/sccache/cache
          key: sccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.platform }}-

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON

      - name: Register GCC diagnostics
        if: runner.os == 'Linux'
        run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/build-windows.ps1 `
            -SkipTests `
            -BuildDir build `
            -Configuration Release `
            -Architecture '${{ matrix.cmake_arch }}' `
            -Jobs 2 `
            -Target ALL_BUILD

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build --parallel 2

      # Diagnostic-backend binaries only: the Cubism SDK is proprietary and is
      # never built or distributed from CI (see README for local SDK builds).
      - name: Upload Windows build artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-test-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Release/BongoCat.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unix build artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-test-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/BongoCat
          if-no-files-found: error
          retention-days: 14
