name: Release and Nightly BongoCat

# Runtime-Core release build: CI downloads the Cubism SDK straight from the
# official site to compile the Cubism Framework and bridge, but the Core
# binary itself is never shipped - release packages render Live2D only after
# the end user imports the Core (in-app import or the live2d drop-in folder).
# The workflow is guarded to the fork and maintained by a user who accepted
# the Live2D Proprietary Software License Agreement (see README).

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
    # Documentation-only pushes do not produce development builds.
    # GitHub does not apply path filters to tag pushes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

env:
  CUBISM_SDK_VERSION: "5-r.5"
  GLEW_VERSION: "2.2.0"
  SOURCE_REF: ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: bongocat-release-${{ github.ref_type == 'tag' && github.ref || 'nightly-dev' }}
  cancel-in-progress: false

jobs:
  version-check:
    name: quality / release-source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Validate tag matches project version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./.github/scripts/check-tag-version.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Resolve immutable build source and release tag
        id: source
        shell: pwsh
        run: |
          $version = (& ./packaging/get-project-version.ps1).AppVersion
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source commit' }
          $nightly = $env:GITHUB_REF_TYPE -ne 'tag'
          $tag = if ($nightly) {
            "nightly-dev-$([DateTime]::UtcNow.ToString('yyyyMMdd'))-$env:GITHUB_RUN_ID"
          } else { $env:GITHUB_REF_NAME }
          @("version=$version", "sha=$sha", "tag=$tag",
            "prerelease=$($nightly.ToString().ToLowerInvariant())") |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  build:
    name: build / ${{ matrix.platform }}
    needs: version-check
    if: github.repository == 'TianMengLucky/BongoCat-X'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_arch: x64
            cubism_vulkan: 'ON'
            cubism_metal: 'OFF'
          - os: windows-2022
            platform: windows-x86
            cmake_arch: Win32
            cubism_vulkan: 'ON'
            cubism_metal: 'OFF'
          - os: ubuntu-22.04
            platform: linux-x64
            cmake_arch: ''
            cubism_vulkan: 'ON'
            cubism_metal: 'OFF'
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
            cubism_vulkan: 'OFF'
            cubism_metal: 'ON'
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64
            cubism_vulkan: 'OFF'
            cubism_metal: 'ON'

    env:
      # Wrap rustc too, so the bongo-safe crate shares the compiler cache.
      RUSTC_WRAPPER: sccache
      RELEASE_TAG: ${{ needs.version-check.outputs.tag }}
    steps:
      - name: Checkout resolved release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version-check.outputs.sha }}

      # Per-platform resume: when a previous run of this tag already
      # published this platform's assets, skip the build entirely so one
      # failing platform can be rebuilt alone without re-running the rest.
      # Runs before any dependency installation so skipped platforms exit fast.
      - name: Skip platforms already published
        id: skip-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $version = '${{ needs.version-check.outputs.version }}'
          $prefix = "BongoCat-X-$version-${{ matrix.platform }}"
          $assets = @()
          $releaseJson = gh release view "$env:RELEASE_TAG" --json assets --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.assets) {
              $assets = @($release.assets | ForEach-Object { $_.name })
            }
          } else {
            Write-Host 'No existing release for this tag yet; building'
          }
          $existing = @($assets | Where-Object { $_ -and $_.StartsWith($prefix) })
          if ($existing.Count -gt 0) {
            Write-Host "Already published: $($existing -join ', ')"
            'skip=true' | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          } else {
            Write-Host 'No assets for this platform yet; building'
            'skip=false' | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          }
          exit 0

      # The bongo-safe Rust crate is a hard build requirement (cmake/Rust.cmake).
      - name: Set up Rust toolchain
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('src/rust/**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Set validated package version
        id: version
        if: steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          $version = $projectVersion.AppVersion
          if ($version -ne '${{ needs.version-check.outputs.version }}') {
            throw "Resolved source project version changed: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Append -Encoding utf8

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && steps.skip-check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxi-dev libxfixes-dev libcurl4-openssl-dev \
            libfontconfig1-dev glslang-tools curl file desktop-file-utils

      # sccache is not packaged for Ubuntu 22.04 (jammy); use the official
      # static musl binary instead of an apt package.
      - name: Install sccache (Linux)
        if: runner.os == 'Linux' && steps.skip-check.outputs.skip != 'true'
        run: |
          curl -fsSL -o /tmp/sccache.tar.gz \
            https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          sudo install /tmp/sccache-v0.9.1-x86_64-unknown-linux-musl/sccache \
            /usr/local/bin/sccache
          sccache --version

      - name: Install macOS dependencies
        if: runner.os == 'macOS' && steps.skip-check.outputs.skip != 'true'
        run: brew install sccache

      - name: Install Windows dependencies
        if: runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: choco install sccache -y --no-progress

      - name: Install Vulkan shader compiler (Windows)
        if: runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = '16.6.0'
          $archive = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $output = Join-Path $env:RUNNER_TEMP 'glslang'
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-$version-windows-x86_64-release.zip" -OutFile $archive
          $expected = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Vulkan shader compiler checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $output
          $compiler = Get-ChildItem -LiteralPath $output -Filter 'glslang*.exe' -Recurse |
            Where-Object { $_.Name -in @('glslang.exe', 'glslangValidator.exe') } |
            Select-Object -First 1
          if (-not $compiler) { throw 'Vulkan shader compiler missing from archive' }
          $compiler.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Restore compiler cache
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/sccache
            ~/Library/Caches/Mozilla.sccache
            ~/AppData/Local/Mozilla/sccache/cache
          key: sccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.platform }}-

      # Compiles the Cubism Framework + bridge into the runtime-Core binary.
      # The Core binary extracted here is build-time only: the package steps
      # assert that no Live2DCubismCore.* ever reaches the release output.
      - name: Restore Cubism SDK
        if: steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = $env:RUNNER_TEMP
          $sdkZip = Join-Path $tmp 'cubism-sdk.zip'
          $glewZip = Join-Path $tmp 'glew.zip'
          Invoke-WebRequest -Uri `
            "https://cubism.live2d.com/sdk-native/bin/CubismSdkForNative-$env:CUBISM_SDK_VERSION.zip" `
            -OutFile $sdkZip
          Invoke-WebRequest -Uri `
            "https://github.com/nigels-com/glew/releases/download/glew-$env:GLEW_VERSION/glew-$env:GLEW_VERSION.zip" `
            -OutFile $glewZip
          $sdkOut = Join-Path $tmp 'cubism-sdk'
          $glewOut = Join-Path $tmp 'glew'
          Expand-Archive -LiteralPath $sdkZip -DestinationPath $sdkOut -Force
          Expand-Archive -LiteralPath $glewZip -DestinationPath $glewOut -Force
          if (Test-Path vendor/CubismSdkForNative) {
            Remove-Item -LiteralPath vendor/CubismSdkForNative -Recurse -Force
          }
          New-Item -ItemType Directory -Path vendor -Force | Out-Null
          $sdkDir = @(Get-ChildItem -LiteralPath $sdkOut -Directory)[0].FullName
          Move-Item -LiteralPath $sdkDir -Destination vendor/CubismSdkForNative
          $glewDir = @(Get-ChildItem -LiteralPath $glewOut -Directory)[0].FullName
          $glewTarget =
            'vendor/CubismSdkForNative/Samples/OpenGL/thirdParty/glew'
          New-Item -ItemType Directory -Path $glewTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $glewDir '*') -Destination $glewTarget `
            -Recurse -Force
          foreach ($required in @(
              'vendor/CubismSdkForNative/Core/include/Live2DCubismCore.h',
              "$glewTarget/include/GL/glew.h",
              "$glewTarget/src/glew.c")) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Unexpected archive layout, missing: $required"
            }
          }
          Write-Host "Restored Cubism SDK $env:CUBISM_SDK_VERSION and GLEW $env:GLEW_VERSION"

      - name: Configure Unix release
        if: runner.os != 'Windows' && steps.skip-check.outputs.skip != 'true'
        run: |
          attempt=1
          until cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBONGO_CAT_REQUIRE_CUBISM=ON \
            -DBONGO_CAT_CUBISM_VULKAN=${{ matrix.cubism_vulkan }} \
            -DBONGO_CAT_CUBISM_METAL=${{ matrix.cubism_metal }} \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Build Windows release
        if: runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          :retry foreach ($attempt in 1..3) {
            try {
              & ./scripts/build-windows.ps1 `
                -SkipTests `
                -RequireCubism `
                -BuildDir build-release `
                -Configuration Release `
                -Architecture '${{ matrix.cmake_arch }}' `
                -Jobs 2 `
                -Target ALL_BUILD
              if ($LASTEXITCODE -eq 0) { break retry }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
            } catch {
              if ($attempt -eq 3) { throw }
            }
            Write-Host "Build attempt $attempt failed (likely a transient dependency download error); retrying"
          }

      - name: Build Unix release
        if: runner.os != 'Windows' && steps.skip-check.outputs.skip != 'true'
        run: bash .github/scripts/build-unix.sh cmake --build build-release --parallel 2

      - name: Check native shader resources before packaging
        if: steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $vulkan = Get-ChildItem build-release -Filter '*.spv' -Recurse
          $metal = Get-ChildItem build-release -Filter '*.metallib' -Recurse
          if ('${{ matrix.cubism_vulkan }}' -eq 'ON') {
            if (-not $vulkan -or $metal) { throw 'Invalid Vulkan/Metal shader selection' }
          } elseif (-not $metal -or $vulkan) { throw 'Invalid Metal/Vulkan shader selection' }

      - name: Install Inno Setup
        if: runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: >-
          & ./.github/scripts/install-inno.ps1

      - name: Package Windows release
        if: runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-X-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --config Release --target package-portable
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows portable packaging failed'
          }
          cmake --build build-release --config Release --target package-installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer packaging failed'
          }

          $portable = "build-release/dist/$name-portable.zip"
          $portableChecksum = "$portable.sha256"
          $setup = "build-release/dist/$name-setup.exe"
          $setupChecksum = "$setup.sha256"
          foreach ($file in @($portable, $setup, $setupChecksum)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Release file is missing: $file"
            }
          }
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $([IO.Path]::GetFileName($portable))" |
            Set-Content -LiteralPath $portableChecksum -Encoding ascii

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $portable, $portableChecksum, $setup, `
            $setupChecksum -Destination release-output

          # Build-time-only Core: no Live2DCubismCore.* may leave vendor/.
          $leaked = @(Get-ChildItem build-release -Recurse -File `
            -Filter 'Live2DCubismCore.*' |
            Where-Object { $_.FullName -notmatch '\\vendor\\' })
          if ($leaked.Count) {
            throw ("Core binary outside vendor/: " +
                  ($leaked.FullName -join ', '))
          }

      - name: Upload Windows installer failure log
        if: failure() && runner.os == 'Windows' && steps.skip-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer-log-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build-release/installer.log
          if-no-files-found: ignore

      - name: Package Unix release
        if: runner.os != 'Windows' && steps.skip-check.outputs.skip != 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-X-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --target package
          if ($LASTEXITCODE -ne 0) {
            throw 'Unix archive packaging failed'
          }
          $archives = @(Get-ChildItem build-release/dist -File | Where-Object {
            $_.Name -match '\.(zip|tar\.gz)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected one Unix release archive, found $($archives.Count)"
          }
          $archive = $archives[0]
          $packageCheckArgs = @{
            Archive = $archive.FullName
            Platform = '${{ matrix.platform }}'
            SkipSmoke = '${{ matrix.platform }}'.StartsWith('macos-')
            ExpectLive2D = $true
            ExpectInox2D = $true
          }
          & ./.github/scripts/check-unix-package.ps1 @packageCheckArgs
          $checksum = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum is missing: $checksum"
          }

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $archive.FullName, $checksum `
            -Destination release-output

          if ('${{ matrix.platform }}' -eq 'linux-x64') {
            cmake --build build-release --target package-appimage
            if ($LASTEXITCODE -ne 0) { throw 'AppImage packaging failed' }
            $appimage = Get-Item build-release/dist/*.AppImage
            bash ./.github/scripts/check-appimage.sh $appimage.FullName
            $appimageHash = (Get-FileHash $appimage -Algorithm SHA256).Hash.ToLowerInvariant()
            "$appimageHash  $($appimage.Name)" | Set-Content "$($appimage.FullName).sha256" -Encoding ascii
            Copy-Item -LiteralPath $appimage.FullName, "$($appimage.FullName).sha256" -Destination release-output
          }

      - name: Upload packaged release
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-release-${{ matrix.platform }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

      # Every platform publishes its own assets straight to the tag's
      # release, so one failing platform never blocks the others.
      - name: Verify release checksums
        if: steps.skip-check.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-ChildItem release-output -Filter *.sha256 | ForEach-Object {
            $line = (Get-Content -LiteralPath $_.FullName -Raw).Trim()
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw "Invalid checksum file: $($_.Name)"
            }
            $payload = Join-Path release-output $Matches[2]
            if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
              throw "Checksum names a missing file: $Matches[2]"
            }
            $actual = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash
            if ($actual -ne $Matches[1]) {
              throw "Checksum mismatch: $payload"
            }
            Write-Host "Verified $($_.Name)"
          }

      - name: Extract release notes from CHANGELOG
        if: steps.skip-check.outputs.skip != 'true'
        shell: bash
        run: |
          python3 .github/scripts/extract-changelog.py \
            --tag "$RELEASE_TAG" \
            --artifact-version '${{ needs.version-check.outputs.version }}' \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md
          if [ '${{ needs.version-check.outputs.prerelease }}' = 'true' ]; then
            python3 .github/scripts/nightly-notes.py \
              --notes release-notes.md --sha '${{ needs.version-check.outputs.sha }}' \
              --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          fi

      - name: Publish release assets
        if: github.repository == 'TianMengLucky/BongoCat-X' &&
          steps.skip-check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.version-check.outputs.prerelease == 'true' && format('BongoCat dev Nightly {0}', needs.version-check.outputs.tag) || format('BongoCat v{0}', steps.version.outputs.version) }}
          tag_name: ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ needs.version-check.outputs.sha }}
          prerelease: ${{ needs.version-check.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: ${{ needs.version-check.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: release-output/*

  virus-total:
    name: security / virustotal
    needs: version-check
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    # CI and releases share the same VirusTotal API quota.
    concurrency:
      group: bongocat-virustotal
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # Discover artifacts while matrix jobs are still building. A single
      # worker owns the rolling request window for every platform.
      - name: Scan artifacts as they become available
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -u .github/scripts/watch-virustotal.py
          --artifact-prefix 'bongocat-release-'
          --producer-prefix 'build / '

      - name: Add VirusTotal note when scanning is skipped
        if: always() && hashFiles('virustotal-report-*.json') == ''
        run: |
          {
            echo "## VirusTotal scans"
            echo
            echo "No report was produced. Check the scan logs and VIRUSTOTAL_API_KEY configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VirusTotal reports
        if: always() && hashFiles('virustotal-report-*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: virustotal-report-*.json
          if-no-files-found: error
          retention-days: 90

