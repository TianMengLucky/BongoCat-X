name: Release BongoCat

# Releases are built WITHOUT the Live2D Cubism SDK (diagnostic rendering
# backend). The SDK is proprietary and is never restored, built, or
# distributed from CI - SDK-enabled binaries must be built locally by users
# who accept the Live2D license (see README for the exact steps).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bongocat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    name: quality / tag-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate tag matches project version
        shell: pwsh
        run: ./.github/scripts/check-tag-version.ps1 -Tag $env:GITHUB_REF_NAME

  build:
    name: build / ${{ matrix.platform }}
    needs: version-check
    if: github.repository == 'TianMengLucky/BongoCat-X'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_arch: x64
          - os: windows-2022
            platform: windows-x86
            cmake_arch: Win32
          - os: ubuntu-22.04
            platform: linux-x64
            cmake_arch: ''
          - os: macos-15-intel
            platform: macos-x64
            cmake_arch: x86_64
          - os: macos-15
            platform: macos-arm64
            cmake_arch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate tag version
        id: version
        shell: pwsh
        run: |
          $projectVersion = & ./packaging/get-project-version.ps1
          $version = $projectVersion.AppVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Append -Encoding utf8

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev \
            libxfixes-dev libcurl4-openssl-dev libfontconfig1-dev \
            curl file desktop-file-utils

      - name: Configure Unix release
        if: runner.os != 'Windows'
        run: |
          attempt=1
          until cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBONGO_CAT_OPTIMIZE_RELEASE_SIZE=ON \
            -DBONGO_CAT_OPTIMIZE_RELEASE_IPO=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DBONGO_CAT_REQUIRE_CUBISM=OFF \
            -DBONGO_CAT_WARNINGS_AS_ERRORS=ON; do
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Configure attempt $attempt failed (likely a transient dependency download error); retrying"
            attempt=$((attempt + 1))
          done

      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          :retry foreach ($attempt in 1..3) {
            try {
              & ./scripts/build-windows.ps1 `
                -SkipTests `
                -BuildDir build-release `
                -Configuration Release `
                -Architecture '${{ matrix.cmake_arch }}' `
                -Jobs 2 `
                -Target ALL_BUILD
              if ($LASTEXITCODE -eq 0) { break retry }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
            } catch {
              if ($attempt -eq 3) { throw }
            }
            Write-Host "Build attempt $attempt failed (likely a transient dependency download error); retrying"
          }

      - name: Build Unix release
        if: runner.os != 'Windows'
        run: bash .github/scripts/build-unix.sh cmake --build build-release --parallel 2

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & ./.github/scripts/install-inno.ps1

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-X-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --config Release --target package-portable
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows portable packaging failed'
          }
          cmake --build build-release --config Release --target package-installer
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer packaging failed'
          }

          $portable = "build-release/dist/$name-portable.exe"
          $portableChecksum = "$portable.sha256"
          $setup = "build-release/dist/$name-setup.exe"
          $setupChecksum = "$setup.sha256"
          foreach ($file in @($portable, $setup, $setupChecksum)) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Release file is missing: $file"
            }
          }
          $portableHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $([IO.Path]::GetFileName($portable))" |
            Set-Content -LiteralPath $portableChecksum -Encoding ascii

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $portable, $portableChecksum, $setup, `
            $setupChecksum -Destination release-output

      - name: Upload Windows installer failure log
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-log-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build-release/installer.log
          if-no-files-found: ignore

      - name: Package Unix release
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $name = (Get-Content build-release/bongocat-package-name.txt -Raw).Trim()
          $expected = "BongoCat-X-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          if ($name -ne $expected) {
            throw "Unexpected release package name: $name"
          }

          cmake --build build-release --target package
          if ($LASTEXITCODE -ne 0) {
            throw 'Unix archive packaging failed'
          }
          $archives = @(Get-ChildItem build-release/dist -File | Where-Object {
            $_.Name -match '\.(zip|tar\.gz)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected one Unix release archive, found $($archives.Count)"
          }
          $archive = $archives[0]
          $packageCheckArgs = @{
            Archive = $archive.FullName
            Platform = '${{ matrix.platform }}'
            SkipSmoke = '${{ matrix.platform }}'.StartsWith('macos-')
          }
          & ./.github/scripts/check-unix-package.ps1 @packageCheckArgs
          $checksum = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum is missing: $checksum"
          }

          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item -LiteralPath $archive.FullName, $checksum `
            -Destination release-output

          if ('${{ matrix.platform }}' -eq 'linux-x64') {
            cmake --build build-release --target package-appimage
            if ($LASTEXITCODE -ne 0) { throw 'AppImage packaging failed' }
            $appimage = Get-Item build-release/dist/*.AppImage
            bash ./.github/scripts/check-appimage.sh $appimage.FullName
            $appimageHash = (Get-FileHash $appimage -Algorithm SHA256).Hash.ToLowerInvariant()
            "$appimageHash  $($appimage.Name)" | Set-Content "$($appimage.FullName).sha256" -Encoding ascii
            Copy-Item -LiteralPath $appimage.FullName, "$($appimage.FullName).sha256" -Destination release-output
          }

      - name: Upload packaged release
        uses: actions/upload-artifact@v7
        with:
          name: bongocat-release-${{ matrix.platform }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

      # Every platform publishes its own assets straight to the tag's
      # release, so one failing platform never blocks the others.
      - name: Verify release checksums
        shell: pwsh
        run: |
          Get-ChildItem release-output -Filter *.sha256 | ForEach-Object {
            $line = (Get-Content -LiteralPath $_.FullName -Raw).Trim()
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') {
              throw "Invalid checksum file: $($_.Name)"
            }
            $payload = Join-Path release-output $Matches[2]
            if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
              throw "Checksum names a missing file: $Matches[2]"
            }
            $actual = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash
            if ($actual -ne $Matches[1]) {
              throw "Checksum mismatch: $payload"
            }
            Write-Host "Verified $($_.Name)"
          }

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          python3 .github/scripts/extract-changelog.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md

      - name: Publish release assets
        if: github.repository == 'TianMengLucky/BongoCat-X'
        uses: softprops/action-gh-release@v2
        with:
          name: BongoCat v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          allow_updates: true
          make_latest: true
          files: release-output/*

  virus-total:
    name: security / virustotal
    needs: version-check
    if: github.repository == 'vladelaina/BongoCat'
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    # CI and releases share the same VirusTotal API quota.
    concurrency:
      group: bongocat-virustotal
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # Discover artifacts while matrix jobs are still building. A single
      # worker owns the rolling request window for every platform.
      - name: Scan artifacts as they become available
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -u .github/scripts/watch-virustotal.py
          --artifact-prefix 'bongocat-release-'
          --producer-prefix 'build / '

      - name: Add VirusTotal note when scanning is skipped
        if: always() && hashFiles('virustotal-report-*.json') == ''
        run: |
          {
            echo "## VirusTotal scans"
            echo
            echo "No report was produced. Check the scan logs and VIRUSTOTAL_API_KEY configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VirusTotal reports
        if: always() && hashFiles('virustotal-report-*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: virustotal-report-*.json
          if-no-files-found: error
          retention-days: 90

