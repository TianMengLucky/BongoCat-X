[package]
name = "bongo-inox2d"
version = "2.0.4"
edition = "2021"
publish = false

[lib]
name = "bongo_inox2d"
crate-type = ["cdylib"]

[dependencies]
bongo-safe = { path = "../bongo-safe" }
inox2d = { git = "https://github.com/Inochi2D/inox2d", rev = "d4dd9dd7f16b775042cbda44370570abf9a8cf81" }
inox2d-opengl = { git = "https://github.com/Inochi2D/inox2d", rev = "d4dd9dd7f16b775042cbda44370570abf9a8cf81" }
glam = "0.29"
glow = "0.14.1"
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
serde_json = "1"

bytemuck = { version = "1", features = ["derive"] }

naga = { version = "0.19", features = ["wgsl-in", "spv-out", "msl-out"] }
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = "0.37"
gpu-allocator = { version = "0.25", default-features = false, features = ["vulkan"] }
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27"
foreign-types = "0.5"

[build-dependencies]
naga = { version = "0.19", features = ["wgsl-in", "spv-out", "msl-out"] }
