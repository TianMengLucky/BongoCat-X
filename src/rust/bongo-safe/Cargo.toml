[package]
name = "bongo-safe"
version = "2.0.4"
edition = "2021"
description = "Memory-safety-critical parsers for BongoCat (SHA-256, image decoding, the about-page contributor feed, audio decoding, Live2D expression files), exposed over the C ABI"
publish = false

[lib]
name = "bongo_safe"
crate-type = ["staticlib"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tga",
    "webp",
    "ico",
    "pnm",
    "hdr",
] }
roxmltree = "0.20"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",
    "wav",
    "mp3",
    "flac",
    "pcm",
    "adpcm",
    "vorbis",
] }
