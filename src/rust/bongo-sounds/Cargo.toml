[package]
name = "bongo-sounds"
version = "2.2.4"
edition = "2021"
publish = false
description = "Keyboard sound effects plugin for BongoCat"

[lib]
name = "bongo_sounds"
crate-type = ["cdylib"]

[dependencies]
bongo-plugin = { path = "../bongo-plugin" }

# Keep release code compact without changing unwinding across the FFI boundary.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
