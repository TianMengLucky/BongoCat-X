[package]
name = "bongo-stats"
version = "2.2.3"
edition = "2021"
publish = false
description = "Local aggregate input statistics plugin for BongoCat"

[lib]
name = "bongo_stats"
crate-type = ["cdylib"]

[dependencies]
bongo-plugin = { path = "../bongo-plugin" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }

# Keep release code compact without changing unwinding across the FFI boundary.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
