[package]
name = "bongo-store"
version = "2.2.0"
edition = "2021"
publish = false
description = "Optional model store catalog plugin for BongoCat"
[lib]
name = "bongo_store"
crate-type = ["cdylib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false }
