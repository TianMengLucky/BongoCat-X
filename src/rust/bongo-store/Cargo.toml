[package]
name = "bongo-store"
version = "2.2.2"
edition = "2021"
publish = false
description = "Optional model store catalog plugin for BongoCat"
[lib]
name = "bongo_store"
crate-type = ["cdylib"]
[dependencies]
bongo-plugin = { path = "../bongo-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Keep release code compact without changing unwinding across the FFI boundary.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
